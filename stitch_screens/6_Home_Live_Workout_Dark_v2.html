<body class="font-body-md text-body-md antialiased pb-24 md:pb-0">
<!-- TopAppBar (Mobile) -->
<header class="md:hidden fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant flat no shadows">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-on-surface dark:text-on-surface uppercase">
            GYMLOG
        </div>
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<!-- Top Nav (Desktop) -->
<header class="hidden md:flex fixed top-0 w-full z-50 justify-between items-center px-margin-desktop h-16 bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant">
<div class="font-headline-lg text-headline-lg font-bold tracking-tighter text-on-surface uppercase">GYMLOG V2</div>
<nav class="flex gap-8">
<a class="text-primary font-bold border-b-2 border-primary pb-1" href="#">Home</a>
<a class="text-on-surface-variant hover:text-primary transition-colors pb-1" href="#">Routines</a>
<a class="text-on-surface-variant hover:text-primary transition-colors pb-1" href="#">Cardio</a>

<a class="text-on-surface-variant hover:text-primary transition-colors pb-1" href="#">Settings</a>
</nav>

<main class="pt-16 md:pt-20 px-margin-mobile md:px-margin-desktop max-w-[600px] mx-auto min-h-screen flex flex-col">
<!-- Status Row -->
<div class="flex justify-between items-center mt-stack-sm mb-stack-md">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-outline"></span>
<span class="font-data-mono text-data-mono text-on-surface-variant">45:12</span>
</div>
<button class="px-3 py-1 border-[1.5px] border-primary rounded font-label-caps text-label-caps text-primary uppercase">
                Resume Session
            </button>
</div>
<!-- Header -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Push Day · Monday</h1>
</div>
<!-- Current Exercise -->
<section class="mb-stack-lg flex-grow">
<div class="flex justify-between items-end mb-stack-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Bench Press</h2>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Set 4</span>
</div>
<!-- Input Area -->
<div class="flex items-center gap-gutter mb-stack-md">
<div class="flex-1 hairline-focus border-b border-outline-variant pb-1 flex justify-between items-baseline">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">KG</span>
<input class="bg-transparent border-none text-right font-display-huge text-display-huge p-0 w-full focus:ring-0 text-on-surface" type="number" value="80"/>
</div>
<div class="flex-1 hairline-focus border-b border-outline-variant pb-1 flex justify-between items-baseline">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Reps</span>
<input class="bg-transparent border-none text-right font-display-huge text-display-huge p-0 w-full focus:ring-0 text-on-surface" type="number" value="8"/>
</div>
<button class="w-16 h-16 bg-primary text-background rounded flex items-center justify-center flex-shrink-0 mt-auto">
<span class="material-symbols-outlined" style="font-size: 32px;">check</span>
</button>
</div>
<!-- Log Cards -->
<div class="flex flex-col">
<div class="flex items-center justify-between py-2 dotted-sep">
<div class="flex items-center gap-4">
<span class="font-data-mono text-data-mono text-on-surface-variant w-4">1</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase px-2 py-1 bg-surface-variant rounded">Warmup</span>
</div>
<div class="font-data-mono text-data-mono text-on-surface-variant">
                        60 kg <span class="mx-2">×</span> 12
                    </div>
</div>
<div class="flex items-center justify-between py-2 dotted-sep">
<div class="flex items-center gap-4">
<span class="font-data-mono text-data-mono text-on-surface-variant w-4">2</span>
</div>
<div class="font-data-mono text-data-mono text-on-surface-variant">
                        75 kg <span class="mx-2">×</span> 10
                    </div>
</div>
<div class="flex items-center justify-between py-2 dotted-sep relative">
<div class="absolute left-0 top-0 bottom-0 w-[2px] bg-primary"></div>
<div class="flex items-center gap-4 pl-3">
<span class="font-data-mono text-data-mono text-primary w-4">3</span>
<span class="font-label-caps text-label-caps text-background bg-primary uppercase px-2 py-1 rounded">PR</span>
</div>
<div class="font-data-mono text-data-mono text-primary font-bold">
                        80 kg <span class="mx-2">×</span> 8
                    </div>
</div>
</div>
</section>
<!-- Tools Row -->
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-stack-sm mb-stack-md">
<button class="px-4 py-2 bg-surface-container-high rounded font-label-caps text-label-caps text-on-surface uppercase whitespace-nowrap flex items-center gap-1 border-[1.5px] border-transparent hover:border-outline-variant">
<span class="material-symbols-outlined" style="font-size: 16px;">calculate</span>

<button class="px-4 py-2 bg-surface-container-high rounded font-label-caps text-label-caps text-on-surface uppercase whitespace-nowrap flex items-center gap-1 border-[1.5px] border-transparent hover:border-outline-variant">
<span class="material-symbols-outlined" style="font-size: 16px;">fitness_center</span>

            </button>
<button class="px-4 py-2 bg-surface-container-high rounded font-label-caps text-label-caps text-on-surface uppercase whitespace-nowrap flex items-center gap-1 border-[1.5px] border-transparent hover:border-outline-variant">
<span class="material-symbols-outlined" style="font-size: 16px;">edit_note</span>

</div>

<span class="font-data-mono text-data-mono text-on-surface">01:30</span>
</div>
<div class="h-1 bg-surface-variant w-full overflow-hidden">
<div class="h-full bg-primary w-[60%] border-r-[2px] border-transparent"></div>
</div>
</div>

<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-1 hover:text-primary transition-colors active:translate-y-[-2px] transition-transform w-16" href="#">

<span class="font-label-caps text-label-caps mt-1">Routines</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-1 hover:text-primary transition-colors active:translate-y-[-2px] transition-transform w-16" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">directions_run</span>
<span class="font-label-caps text-label-caps mt-1">Cardio</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-1 hover:text-primary transition-colors active:translate-y-[-2px] transition-transform w-16" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">monitoring</span>
