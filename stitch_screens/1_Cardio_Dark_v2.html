<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gymlog - Cardio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed": "#002112",
                    "secondary-container": "#47464a",
                    "on-tertiary-container": "#78350f",
                    "primary-fixed": "#71fcb6",
                    "tertiary-fixed": "#ffdbcc",
                    "primary-fixed-dim": "#51df9c",
                    "tertiary-container": "#ffa072",
                    "secondary-fixed-dim": "#c8c6c9",
                    "surface-tint": "#51df9c",
                    "surface-container-high": "#2a2a2b",
                    "surface-bright": "#3a393a",
                    "inverse-on-surface": "#313031",
                    "on-background": "#e5e2e3",
                    "inverse-surface": "#e5e2e3",
                    "on-primary-fixed-variant": "#005233",
                    "on-tertiary-fixed": "#351000",
                    "surface": "#131314",
                    "inverse-primary": "#006c45",
                    "surface-variant": "#353436",
                    "on-primary": "#003822",
                    "on-tertiary-fixed-variant": "#76330d",
                    "on-error-container": "#ffdad6",
                    "on-primary-container": "#005434",
                    "surface-container-highest": "#353436",
                    "error-container": "#93000a",
                    "secondary": "#c8c6c9",
                    "outline": "#869489",
                    "on-secondary-fixed": "#1b1b1e",
                    "on-surface": "#e5e2e3",
                    "tertiary": "#ffc7ae",
                    "on-secondary-fixed-variant": "#47464a",
                    "surface-container-low": "#1c1b1c",
                    "surface-container-lowest": "#0e0e0f",
                    "primary": "#60eca8",
                    "surface-dim": "#131314",
                    "primary-container": "#3ecf8e",
                    "tertiary-fixed-dim": "#ffb694",
                    "surface-container": "#201f20",
                    "on-error": "#690005",
                    "on-secondary": "#303033",
                    "outline-variant": "#3d4a41",
                    "error": "#ffb4ab",
                    "background": "#131314",
                    "on-surface-variant": "#bbcabe",
                    "on-secondary-container": "#b6b4b8",
                    "on-tertiary": "#561f00",
                    "secondary-fixed": "#e4e1e5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "margin-mobile": "20px",
                    "stack-lg": "48px",
                    "margin-desktop": "40px",
                    "stack-sm": "8px",
                    "gutter": "16px",
                    "stack-md": "24px"
            },
            "fontFamily": {
                    "label-caps": [
                            "Inter"
                    ],
                    "data-mono": [
                            "Space Grotesk"
                    ],
                    "headline-lg-mobile": [
                            "Space Grotesk"
                    ],
                    "body-md": [
                            "Inter"
                    ],
                    "display-huge": [
                            "Space Grotesk"
                    ],
                    "headline-lg": [
                            "Space Grotesk"
                    ]
            },
            "fontSize": {
                    "label-caps": [
                            "11px",
                            {
                                    "lineHeight": "12px",
                                    "letterSpacing": "0.1em",
                                    "fontWeight": "700"
                            }
                    ],
                    "data-mono": [
                            "18px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "500"
                            }
                    ],
                    "headline-lg-mobile": [
                            "24px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-huge": [
                            "72px",
                            {
                                    "lineHeight": "64px",
                                    "letterSpacing": "-0.04em",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "36px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "600"
                            }
                    ]
            }
          }
        }
      }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .dotted-border-t {
            border-top: 1px dashed theme('colors.outline-variant');
        }
        .dotted-border-b {
            border-bottom: 1px dashed theme('colors.outline-variant');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen pb-20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface border-b border-outline-variant">
<button class="text-on-surface hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-on-surface uppercase">GYMLOG</span>
<button class="text-on-surface hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<main class="pt-20 px-margin-mobile flex flex-col">
<!-- Top Stats (3-column) -->
<section class="flex justify-between items-end dotted-border-b pb-stack-sm mb-stack-md">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Sessions</span>
<span class="font-data-mono text-data-mono text-on-surface">12</span>
</div>
<div class="flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Time</span>
<span class="font-data-mono text-data-mono text-on-surface">4h 12m</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Distance</span>
<span class="font-data-mono text-data-mono text-on-surface">38.4km</span>
</div>
</section>
<!-- Activity Icons Strip -->
<section class="mb-stack-lg">
<div class="flex gap-gutter overflow-x-auto no-scrollbar py-2">
<!-- Active Item -->
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border-2 border-primary rounded-DEFAULT">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">directions_run</span>
</button>
<!-- Inactive Items -->
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border border-outline-variant rounded-DEFAULT opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">directions_bike</span>
</button>
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border border-outline-variant rounded-DEFAULT opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">pool</span>
</button>
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border border-outline-variant rounded-DEFAULT opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">hiking</span>
</button>
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border border-outline-variant rounded-DEFAULT opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">rowing</span>
</button>
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border border-outline-variant rounded-DEFAULT opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">sports_mma</span>
</button>
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border border-outline-variant rounded-DEFAULT opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">sprint</span>
</button>
<button class="flex-shrink-0 flex items-center justify-center w-12 h-12 bg-surface border border-outline-variant rounded-DEFAULT opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">snowboarding</span>
</button>
</div>
</section>
<!-- Hero Stopwatch -->
<section class="flex flex-col justify-center items-start mb-stack-lg min-h-[160px]">
<span class="font-label-caps text-label-caps text-primary uppercase tracking-widest mb-2 flex items-center gap-2">
<span class="w-2 h-2 bg-primary rounded-full animate-pulse"></span>
                Recording
            </span>
<div class="font-display-huge text-display-huge text-on-surface tabular-nums tracking-tighter flex items-baseline">
                24:31<span class="text-primary-container text-[48px] ml-1">.8</span>
</div>
</section>
<!-- Controls -->
<section class="flex gap-gutter mb-stack-lg">
<button class="flex-1 bg-primary text-on-primary-fixed font-label-caps text-label-caps uppercase py-4 rounded-DEFAULT flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">pause</span>
                Pause
            </button>
<button class="flex-1 border-[1.5px] border-outline text-on-surface font-label-caps text-label-caps uppercase py-4 rounded-DEFAULT flex items-center justify-center gap-2 hover:bg-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">stop</span>
                Finish
            </button>
</section>
<!-- History: Recent Entries -->
<section class="flex flex-col mt-4">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-4">Recent Activity</h2>
<div class="flex flex-col">
<!-- Entry 1 -->
<div class="flex justify-between items-center dotted-border-t py-4">
<div class="flex flex-col">
<span class="font-body-md font-bold text-on-surface">Treadmill Intervals</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">TODAY, 06:30 AM</span>
</div>
<div class="flex flex-col items-end">
<span class="font-data-mono text-data-mono text-on-surface">32:00</span>
<span class="font-data-mono text-data-mono text-on-surface-variant text-[14px]">4.2 km</span>
</div>
</div>
<!-- Entry 2 -->
<div class="flex justify-between items-center dotted-border-t py-4">
<div class="flex flex-col">
<span class="font-body-md font-bold text-on-surface">Outdoor Run</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">YESTERDAY, 18:15 PM</span>
</div>
<div class="flex flex-col items-end">
<span class="font-data-mono text-data-mono text-on-surface">45:12</span>
<span class="font-data-mono text-data-mono text-on-surface-variant text-[14px]">6.5 km</span>
</div>
</div>
<!-- Entry 3 -->
<div class="flex justify-between items-center dotted-border-t py-4">
<div class="flex flex-col">
<span class="font-body-md font-bold text-on-surface">Stationary Bike</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">MON, 07:00 AM</span>
</div>
<div class="flex flex-col items-end">
<span class="font-data-mono text-data-mono text-on-surface">60:00</span>
<span class="font-data-mono text-data-mono text-on-surface-variant text-[14px]">22.0 km</span>
</div>
</div>
<!-- Bottom boundary to finish the notebook look -->
<div class="dotted-border-t"></div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-2 pb-safe bg-surface border-t border-outline-variant h-16 md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant pt-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant pt-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined">fitness_center</span>
<span class="font-label-caps text-label-caps mt-1">Routines</span>
</button>
<!-- Active Tab: Cardio -->
<button class="flex flex-col items-center justify-center text-primary border-t-2 border-primary pt-1 translate-y-[-2px] transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions_run</span>
<span class="font-label-caps text-label-caps mt-1">Cardio</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant pt-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined">monitoring</span>
<span class="font-label-caps text-label-caps mt-1">Stats</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant pt-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button>
</nav>
</body></html>
