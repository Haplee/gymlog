<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gymlog - Plate Calculator</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#002112",
                        "secondary-container": "#47464a",
                        "on-tertiary-container": "#78350f",
                        "primary-fixed": "#71fcb6",
                        "tertiary-fixed": "#ffdbcc",
                        "primary-fixed-dim": "#51df9c",
                        "tertiary-container": "#ffa072",
                        "secondary-fixed-dim": "#c8c6c9",
                        "surface-tint": "#51df9c",
                        "surface-container-high": "#2a2a2b",
                        "surface-bright": "#3a393a",
                        "inverse-on-surface": "#313031",
                        "on-background": "#e5e2e3",
                        "inverse-surface": "#e5e2e3",
                        "on-primary-fixed-variant": "#005233",
                        "on-tertiary-fixed": "#351000",
                        "surface": "#131314",
                        "inverse-primary": "#006c45",
                        "surface-variant": "#353436",
                        "on-primary": "#003822",
                        "on-tertiary-fixed-variant": "#76330d",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#005434",
                        "surface-container-highest": "#353436",
                        "error-container": "#93000a",
                        "secondary": "#c8c6c9",
                        "outline": "#869489",
                        "on-secondary-fixed": "#1b1b1e",
                        "on-surface": "#e5e2e3",
                        "tertiary": "#ffc7ae",
                        "on-secondary-fixed-variant": "#47464a",
                        "surface-container-low": "#1c1b1c",
                        "surface-container-lowest": "#0e0e0f",
                        "primary": "#60eca8",
                        "surface-dim": "#131314",
                        "primary-container": "#3ecf8e",
                        "tertiary-fixed-dim": "#ffb694",
                        "surface-container": "#201f20",
                        "on-error": "#690005",
                        "on-secondary": "#303033",
                        "outline-variant": "#3d4a41",
                        "error": "#ffb4ab",
                        "background": "#131314",
                        "on-surface-variant": "#bbcabe",
                        "on-secondary-container": "#b6b4b8",
                        "on-tertiary": "#561f00",
                        "secondary-fixed": "#e4e1e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-mobile": "20px",
                        "stack-lg": "48px",
                        "margin-desktop": "40px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "data-mono": ["Space Grotesk"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "display-huge": ["Space Grotesk"],
                        "headline-lg": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "12px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "data-mono": ["18px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-huge": ["72px", { "lineHeight": "64px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0A0A0B; color: #e5e2e3; }
        .dotted-border-t { border-top: 1px dotted #3d4a41; }
        .hairline-active { border: 2px solid #60eca8; }
        .plate-rect { border: 1.5px solid #60eca8; background-color: transparent; }
        /* Specific bottom sheet override requested */
        .bottom-sheet { background-color: #141416; border-radius: 12px 12px 0 0; }
        .overlay { background-color: rgba(0,0,0,0.6); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col items-center justify-end">
<!-- Dimmed Overlay -->
<div class="fixed inset-0 overlay z-40"></div>
<!-- Bottom Sheet Content Canvas -->
<div class="bottom-sheet w-full max-w-md mx-auto z-50 p-6 flex flex-col relative pb-safe">
<!-- Handle -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-12 h-[2px] bg-primary mt-2"></div>
<!-- Target Weight Input Section -->
<div class="flex items-end justify-between mb-8 mt-4">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-2">TARGET WEIGHT</label>
<div class="relative">
<input class="bg-transparent border-0 border-b border-outline text-display-huge font-display-huge text-on-surface focus:ring-0 focus:border-b-2 focus:border-primary p-0 w-32 pb-1" type="number" value="135"/>
<span class="absolute right-0 bottom-4 font-data-mono text-data-mono text-on-surface-variant">lbs</span>
</div>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-variant hover:bg-outline-variant transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
</div>
<!-- Barbell Visualization -->
<div class="w-full flex items-center justify-center py-stack-md border-y border-outline-variant relative mb-8">
<!-- Bar -->
<div class="absolute w-full h-[6px] bg-outline-variant top-1/2 -translate-y-1/2 z-0"></div>
<!-- Collar -->
<div class="w-[12px] h-[32px] bg-on-surface z-10 mr-1"></div>
<!-- Plates (20, 10, 5, 2.5 represented structurally) -->
<div class="flex items-center gap-1 z-10">
<div class="w-[16px] h-[80px] plate-rect rounded-sm flex items-center justify-center">
<span class="rotate-90 font-label-caps text-[8px] text-primary">45</span>
</div>
<div class="w-[16px] h-[80px] plate-rect rounded-sm flex items-center justify-center">
<span class="rotate-90 font-label-caps text-[8px] text-primary">45</span>
</div>
<div class="w-[12px] h-[60px] plate-rect rounded-sm flex items-center justify-center">
<span class="rotate-90 font-label-caps text-[8px] text-primary">25</span>
</div>
<div class="w-[8px] h-[40px] plate-rect rounded-sm flex items-center justify-center"></div>
</div>
</div>
<!-- Breakdown List -->
<div class="flex flex-col space-y-4 mb-stack-md">
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-2">PER SIDE</h3>
<div class="flex justify-between items-center dotted-border-t pt-4">
<div class="font-body-md text-body-md text-on-surface">45 lb Plate</div>
<div class="font-data-mono text-data-mono text-primary">x2</div>
</div>
<div class="flex justify-between items-center dotted-border-t pt-4">
<div class="font-body-md text-body-md text-on-surface">25 lb Plate</div>
<div class="font-data-mono text-data-mono text-primary">x1</div>
</div>
<div class="flex justify-between items-center dotted-border-t pt-4">
<div class="font-body-md text-body-md text-on-surface">10 lb Plate</div>
<div class="font-data-mono text-data-mono text-on-surface-variant">--</div>
</div>
<div class="flex justify-between items-center dotted-border-t pt-4">
<div class="font-body-md text-body-md text-on-surface">5 lb Plate</div>
<div class="font-data-mono text-data-mono text-on-surface-variant">--</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-4 font-label-caps text-label-caps rounded-sm border-[1.5px] border-primary hover:bg-transparent hover:text-primary transition-colors">
            APPLY TO SET
        </button>
</div>
</body></html>
