name: iOS Signed (ad-hoc)
# Compila y FIRMA un IPA ad-hoc (instalable en iPhones cuyo UDID esté en el
# perfil de aprovisionamiento). A diferencia de ios-build.yml (sin firma, para
# sideload), este produce un IPA instalable directo por Apple Configurator,
# Finder o un servicio de distribución (Diawi, etc.).
#
# Requiere estos secretos de repositorio (Settings -> Secrets and variables ->
# Actions).  Ver ios-custom/SIGNING.md para cómo obtener cada uno:
#   IOS_DIST_CERT_P12_BASE64   -> certificado Apple Distribution (.p12) en base64
#   IOS_DIST_CERT_PASSWORD     -> contraseña de ese .p12
#   IOS_ADHOC_PROFILE_BASE64   -> perfil ad-hoc (.mobileprovision) en base64
#   IOS_TEAM_ID                -> Team ID (10 caracteres) de tu cuenta developer
#   VITE_SUPABASE_URL / VITE_SUPABASE_KEY  -> igual que el resto de builds
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: npm run build
      - name: Add iOS platform (if missing)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Inject custom native code (biometric + health plugins + Info.plist)
        run: |
          cp ios-custom/BiometricPlugin.swift ios-custom/BiometricPlugin.m ios/App/App/
          cp ios-custom/HealthBridgePlugin.swift ios-custom/HealthBridgePlugin.m ios/App/App/
          cp ios-custom/App.entitlements ios/App/App/
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby ios-custom/add-plugin-to-target.rb ios/App/App.xcodeproj
          bash ios-custom/Info.plist.patch.sh ios/App/App/Info.plist
      - name: Inject app icon
        run: |
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do
            cp ios-custom/AppIcon-1024.png "$f"
          done
      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Import signing assets
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KPW="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # Keychain temporal, aislada del login del runner.
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KEYCHAIN" >/dev/null

          # Instala el perfil y extrae UUID + Name (necesarios para exportar).
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PLIST="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PLIST")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive & export (ad-hoc)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # ExportOptions desde la plantilla del repo (| como separador: el nombre
          # del perfil puede llevar espacios).
          sed -e "s|__TEAM_ID__|$TEAM_ID|g" \
              -e "s|__PROFILE_NAME__|$PROFILE_NAME|g" \
              ios-custom/ExportOptions-adhoc.plist > "$RUNNER_TEMP/ExportOptions.plist"

          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          mv "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/GymLog-adhoc-v${VERSION}.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/GymLog-adhoc-v${VERSION}.ipa" >> "$GITHUB_ENV"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymLog-ipa-adhoc
          path: ${{ env.IPA_PATH }}
